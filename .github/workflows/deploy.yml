name: Deploy to iwinv

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 300s
          script: |
            set -e

            cd /var/www/aeolab

            echo "=== Pre-deploy 안전 백업 (reset --hard로 '되돌려지는 추적 변경'만 보존) ==="
            # reset --hard는 추적 파일만 되돌린다(미추적은 살아남음) → 추적 변경(modified·deleted)만 백업해 백업 비대화 방지
            git diff --name-only HEAD > /tmp/_predeploy_tracked 2>/dev/null || true
            CHANGED=$(wc -l < /tmp/_predeploy_tracked)
            if [ "$CHANGED" -gt 0 ]; then
              TS=$(date +%Y%m%d_%H%M%S)
              mkdir -p /var/www/aeolab_predeploy_backups
              tar czf "/var/www/aeolab_predeploy_backups/predeploy_$TS.tgz" -T /tmp/_predeploy_tracked 2>/dev/null || true
              echo "⚠ 추적 변경 ${CHANGED}개 → /var/www/aeolab_predeploy_backups/predeploy_${TS}.tgz 백업 후 진행"
              # 최근 10개만 유지
              ls -1t /var/www/aeolab_predeploy_backups/predeploy_*.tgz 2>/dev/null | tail -n +11 | xargs -r rm -f
            fi

            echo "=== Git Pull ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Backend Update ==="
            source /var/www/aeolab/venv/bin/activate
            pip install -r backend/requirements.txt --quiet
            pm2 restart aeolab-backend

            echo "=== Frontend Build ==="
            cd /var/www/aeolab/frontend
            npm install --legacy-peer-deps
            npm run build
            pm2 restart aeolab-frontend

            echo "=== Deploy Complete ==="
            pm2 status
