name: Deploy to iwinv

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 300s
          script: |
            set -e

            cd /var/www/aeolab

            echo "=== Pre-deploy 안전 백업 (reset --hard로 덮이는 미커밋 변경 보존) ==="
            CHANGED=$(git status --porcelain | wc -l)
            if [ "$CHANGED" -gt 0 ]; then
              TS=$(date +%Y%m%d_%H%M%S)
              mkdir -p /var/www/aeolab_predeploy_backups
              # 미커밋(추적·미추적) 변경 파일을 tar로 보존 — reset --hard 후 복원 가능
              git status --porcelain | sed 's/^...//' | tar czf "/var/www/aeolab_predeploy_backups/predeploy_$TS.tgz" -T - 2>/dev/null || true
              echo "⚠ 미커밋 변경 ${CHANGED}개 발견 → /var/www/aeolab_predeploy_backups/predeploy_${TS}.tgz 에 백업 후 진행"
              # 최근 10개만 유지
              ls -1t /var/www/aeolab_predeploy_backups/predeploy_*.tgz 2>/dev/null | tail -n +11 | xargs -r rm -f
            fi

            echo "=== Git Pull ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Backend Update ==="
            source /var/www/aeolab/venv/bin/activate
            pip install -r backend/requirements.txt --quiet
            pm2 restart aeolab-backend

            echo "=== Frontend Build ==="
            cd /var/www/aeolab/frontend
            npm install --legacy-peer-deps
            npm run build
            pm2 restart aeolab-frontend

            echo "=== Deploy Complete ==="
            pm2 status
