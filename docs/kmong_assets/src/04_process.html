<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>.step { display:flex; align-items:flex-start; padding:26px 0; border-bottom:2px dashed var(--line); } .step:last-of-type{border-bottom:0}
.step .t{font-size:32px;font-weight:800;color:var(--navy)} .step .d{font-size:25px;color:var(--muted);line-height:1.55;margin-top:6px}</style></head><body>
<div class="page">
  <div class="eyebrow">진행 방법</div>
  <h2>주문부터 전달까지<br>4단계로 진행합니다</h2>
  <p class="sub">모든 소통은 크몽 대화창에서만 이루어집니다.</p>
  <div style="margin-top:26px">
    <div class="step"><span class="num">1</span><div><div class="t">주문 후 정보 전달</div><div class="d">가게 정보를 크몽 대화창으로 보내 주세요 (다음 이미지 참고)</div></div></div>
    <div class="step"><span class="num">2</span><div><div class="t">가게 등록과 측정</div><div class="d">판매자가 가게를 등록하고 전체 점검을 실행합니다</div></div></div>
    <div class="step"><span class="num">3</span><div><div class="t">요청하신 문구 작성</div><div class="d">소개글·응대 문구·블로그·검색어는 요청하신 만큼 작성합니다</div></div></div>
    <div class="step"><span class="num">4</span><div><div class="t">결과 정리 전달</div><div class="d">점검 결과와 개선 순서를 정리해 크몽 대화창으로 전달합니다</div></div></div>
  </div>
  <div class="note">납기: 첫 결과는 영업일 기준 <b>2일</b> 이내 · 수정과 추가 질문은 대화창에서 <b>2회</b>까지 지원합니다.</div>
</div>
</body></html>
